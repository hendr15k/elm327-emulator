name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # android-actions/setup-android fails on current runner images because it
      # tries to install the removed "tools" package. The runner ships an SDK,
      # so only locate it and fail loudly when there is none.
      - name: Locate Android SDK
        run: |
          for candidate in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
            if [ -n "$candidate" ] && [ -d "$candidate/platforms" ]; then
              echo "ANDROID_HOME=$candidate" >> "$GITHUB_ENV"
              echo "ANDROID_SDK_ROOT=$candidate" >> "$GITHUB_ENV"
              echo "Using SDK at $candidate"
              exit 0
            fi
          done
          echo "No Android SDK found on this runner" >&2
          exit 1

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
